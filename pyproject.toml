[project]
name = "zoho-mail-mcp"
version = "0.1.0"
description = "MCP server for Zoho Mail: read and search mail over IMAP, send over SMTP behind a draft-and-confirm flow, multiple accounts"
requires-python = ">=3.11"
# mcp pinned <2: the 2.0 SDK replaced FastMCP with a new MCPServer API.
dependencies = ["mcp>=1.2.0,<2", "httpx>=0.27"]

[project.scripts]
zoho-mail-mcp = "zoho_mail_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoho_mail_mcp"]
